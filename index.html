<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤسسة موافي للتنمية الزراعية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f4f9f4;
            color: #333;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #1b4d3e, #2e7d32);
            color: white;
            text-align: center;
            padding: 40px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 900;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
            color: #1b4d3e;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(46, 125, 50, 0.2);
        }

        .product-image-container {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(45deg, #e8f5e9, #c8e6c9);
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image-container img {
            transform: scale(1.08);
        }

        .product-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.3rem;
            color: #1b4d3e;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .product-price {
            font-size: 1.25rem;
            color: #2e7d32;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .product-specs {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
            flex-grow: 1;
        }

        .card-buttons {
            display: flex;
            gap: 10px;
        }

        .details-btn {
            background-color: #1b4d3e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: background-color 0.3s ease;
        }

        .details-btn:hover {
            background-color: #2e7d32;
        }

        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background-color 0.3s ease;
            flex: 1;
            text-align: center;
        }

        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }

        /* نافذة تفاصيل المنتج المنبثقة */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 1.8rem;
            color: #999;
            cursor: pointer;
            background: none;
            border: none;
            font-weight: bold;
        }

        .modal-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .modal-title {
            color: #1b4d3e;
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .modal-price {
            font-size: 1.4rem;
            color: #2e7d32;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .modal-desc {
            font-size: 1.05rem;
            color: #555;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        footer {
            background-color: #1b4d3e;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 60px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>مؤسسة موافي للتنمية الزراعية</h1>
        <p>بوابتك المتقدمة لأفضل المنتجات الزراعية والمستلزمات الاحترافية</p>
    </header>

    <div class="container">
        <h2 class="section-title">قائمة المنتجات والمواصفات</h2>
        
        <!-- شبكة المنتجات -->
        <div class="products-grid" id="productsGrid">
            <!-- المنتجات بتنزل هنا أوتوماتيك -->
        </div>
    </div>

    <!-- نافذة عرض التفاصيل المنبثقة -->
    <div id="productModal" class="modal-overlay" onclick="closeProductModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModalDirect()">&times;</button>
            <img id="modalImg" class="modal-img" src="" alt="صورة المنتج">
            <h2 id="modalTitle" class="modal-title"></h2>
            <div id="modalPrice" class="modal-price"></div>
            <p id="modalDesc" class="modal-desc"></p>
            <a id="modalWhatsapp" href="#" target="_blank" class="whatsapp-btn" style="width: 100%; padding: 14px; font-size: 1.1rem; justify-content: center;">
                <span>طلب هذا المنتج عبر الواتساب</span>
            </a>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 - مؤسسة موافي للتنمية الزراعية | تواصل معنا: 01015421512</p>
    </footer>

    <script>
        // قراءة المنتجات المعروضة
        let products = JSON.parse(localStorage.getItem('mowafy_products')) || [
            {
                id: 1,
                title: "سماد مركب عالي النقاء (N-P-K)",
                price: "450 ج.م / شيكارة",
                img: "https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=600&q=80",
                fullImg: "https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=800&q=80",
                shortDesc: "<strong>المواصفات:</strong> مركب متوازن لتحفيز النمو الخضري والجذري.<br><strong>الاستخدام:</strong> مناسب لجميع المحاصيل بمعدل 5 كجم للفدان.",
                fullDesc: "<strong>التفاصيل الكاملة:</strong> مركب متوازن عالي النقاء مصمم خصيصاً لتحفيز النمو الخضري والجذري وزيادة الإنتاجية الزراعية.<br><br><strong>طريقة الاستخدام:</strong> مناسب لجميع المحاصيل الحقلية والخضروات بمعدل 5 كجم للفدان رياً مع المياه صباحاً أو قبل الغروب."
            },
            {
                id: 2,
                title: "مبيد ومخصب عضوي آمن",
                price: "280 ج.م / لتر",
                img: "https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?auto=format&fit=crop&w=600&q=80",
                fullImg: "https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?auto=format&fit=crop&w=800&q=80",
                shortDesc: "<strong>المواصفات:</strong> مستخلص طبيعي لمكافحة الآفات وتحسين المناعة.<br><strong>الاستخدام:</strong> يخلط بمعدل 3 سم لكل لتر ماء.",
                fullDesc: "<strong>التفاصيل الكاملة:</strong> مستخلص طبيعي 100% لمكافحة الآفات وتحسين مناعة النبات وحماية الجذور من الأمراض الفطرية.<br><br><strong>طريقة الاستخدام:</strong> يخلط بمعدل 3 سم لكل لتر ماء ويرش صباحاً بانتظام للحصول على أفضل نتيجة."
            }
        ];

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            products.forEach((p) => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-image-container">
                            <img src="${p.img}" alt="${p.title}">
                        </div>
                        <div class="product-content">
                            <h3 class="product-title">${p.title}</h3>
                            <div class="product-price">${p.price}</div>
                            <p class="product-specs">${p.shortDesc}</p>
                            <div class="card-buttons">
                                <button class="details-btn" onclick="openProductModal('${p.title}', '${p.price}', '${p.fullImg}', '${p.fullDesc.replace(/'/g, "\\'")}')">عرض التفاصيل</button>
                                <a href="https://wa.me/2001015421512?text=أرغب%20في%20طلب%20${encodeURIComponent(p.title)}" target="_blank" class="whatsapp-btn">اطلب الآن</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openProductModal(title, price, imgSrc, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('modalImg').src = imgSrc;
            document.getElementById('modalDesc').innerHTML = desc;
            
            const waUrl = `https://wa.me/2001015421512?text=أرغب%20في%20طلب%20${encodeURIComponent(title)}`;
            document.getElementById('modalWhatsapp').href = waUrl;

            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModalDirect() {
            document.getElementById('productModal').style.display = 'none';
        }

        function closeProductModal(event) {
            if (event.target.id === 'productModal') {
                document.getElementById('productModal').style.display = 'none';
            }
        }

        window.onload = function() {
            renderProducts();
        };
    </script>
</body>
</html>
