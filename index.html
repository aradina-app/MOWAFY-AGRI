<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤسسة موافي للتنمية الزراعية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f4f9f4; color: #333; overflow-x: hidden; }

        header {
            background: linear-gradient(135deg, #1b4d3e, #2e7d32);
            color: white;
            text-align: center;
            padding: 40px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        header h1 { font-size: 2.2rem; margin-bottom: 10px; font-weight: 900; }
        header p { font-size: 1.1rem; opacity: 0.9; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .section-title { text-align: center; margin-bottom: 30px; color: #1b4d3e; font-size: 1.8rem; font-weight: 700; }

        /* شبكة المنتجات للعملاء */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }
        .product-card {
            background: #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
            border: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover { transform: translateY(-8px); }
        .product-image-container { width: 100%; height: 200px; background: #e8f5e9; }
        .product-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .product-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 1.3rem; color: #1b4d3e; margin-bottom: 10px; font-weight: 700; }
        .product-price { font-size: 1.25rem; color: #2e7d32; font-weight: 900; margin-bottom: 12px; }
        .product-specs { font-size: 0.95rem; color: #666; margin-bottom: 20px; line-height: 1.6; flex-grow: 1; }
        .card-buttons { display: flex; gap: 10px; }
        .details-btn { background-color: #1b4d3e; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; flex: 1; }
        .whatsapp-btn { background-color: #25d366; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; flex: 1; text-align: center; }

        /* رسالة التحميل */
        .loading-msg {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: #1b4d3e;
            padding: 40px;
            font-weight: bold;
        }

        /* Modal تفاصيل المنتج */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #fff; border-radius: 20px; max-width: 600px; width: 100%; padding: 30px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 15px; left: 20px; font-size: 1.8rem; background: none; border: none; cursor: pointer; color: #999; }
        .modal-img { width: 100%; height: 250px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }
        .modal-title { color: #1b4d3e; font-size: 1.6rem; font-weight: 900; margin-bottom: 10px; }
        .modal-price { font-size: 1.4rem; color: #2e7d32; font-weight: 900; margin-bottom: 15px; }
        .modal-desc { font-size: 1.05rem; color: #555; line-height: 1.8; margin-bottom: 25px; }

        footer { background-color: #1b4d3e; color: white; text-align: center; padding: 25px; margin-top: 60px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <h1>مؤسسة موافي للتنمية الزراعية</h1>
        <p>بوابتك المتقدمة لأفضل المنتجات الزراعية والمستلزمات الاحترافية</p>
    </header>

    <div class="container">
        <h2 class="section-title">قائمة المنتجات والمواصفات</h2>
        <div class="products-grid" id="productsGrid">
            <div class="loading-msg">⏳ جاري تحميل المنتجات من جدول المؤسسة...</div>
        </div>
    </div>

    <!-- Modal التفاصيل -->
    <div id="productModal" class="modal-overlay" onclick="closeModalBg(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <img id="modalImg" class="modal-img" src="" alt="صورة">
            <h2 id="modalTitle" class="modal-title"></h2>
            <div id="modalPrice" class="modal-price"></div>
            <p id="modalDesc" class="modal-desc"></p>
            <a id="modalWhatsapp" href="#" target="_blank" class="whatsapp-btn" style="width: 100%; padding: 14px; justify-content: center;">طلب المنتج عبر الواتساب</a>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 - مؤسسة موافي للتنمية الزراعية | تواصل معنا: 01015421512</p>
    </footer>

    <script>
        // رابط جدول جوجل شيتس الخاص بك بصيغة الـ CSV المباشرة
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1Tlg9It_xLpN9GR2DWhpsJs1KjbrH4o1KMLDgPPIko5o/export?format=csv';

        async function fetchProductsFromSheet() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                document.getElementById('productsGrid').innerHTML = '<div class="loading-msg" style="color: red;">عذراً، حدث خطأ في تحميل المنتجات. تأكد من اتصال الإنترنت أو مشاركة الجدول.</div>';
            }
        }

        function parseCSV(text) {
            const rows = text.split('\n').map(row => {
                // تقسيم البيانات مع مراعاة النصوص التي تحتوي على فواصل
                const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || row.split(',');
                return rows = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(item => item.replace(/^"|"$/g, '').trim());
            });

            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            // نبدأ من الصف الثاني (تخطي الصف الأول الخاص بعناوين الأعمدة)
            for (let i = 1; i < text.split('\n').length; i++) {
                const line = text.split('\n')[i];
                if (!line.trim()) continue;
                
                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(item => item.replace(/^"|"$/g, '').trim());
                
                const title = cols[0] || '';
                const price = cols[1] || '';
                const img = cols[2] || 'https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=600&q=80';
                const shortDesc = cols[3] || '';
                const fullDesc = cols[4] || title;

                if (title) {
                    grid.innerHTML += `
                        <div class="product-card">
                            <div class="product-image-container">
                                <img src="${img}" alt="${title}">
                            </div>
                            <div class="product-content">
                                <h3 class="product-title">${title}</h3>
                                <div class="product-price">${price}</div>
                                <p class="product-specs">${shortDesc}</p>
                                <div class="card-buttons">
                                    <button class="details-btn" onclick="openModal('${title.replace(/'/g, "\\'")}', '${price.replace(/'/g, "\\'")}', '${img}', '${fullDesc.replace(/'/g, "\\'")}')">التفاصيل</button>
                                    <a href="https://wa.me/2001015421512?text=أرغب%20في%20طلب%20${encodeURIComponent(title)}" target="_blank" class="whatsapp-btn">اطلب الآن</a>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            if (grid.innerHTML === '') {
                grid.innerHTML = '<div class="loading-msg">لا توجد منتجات مضافة في الجدول حالياً.</div>';
            }
        }

        window.onload = function() {
            fetchProductsFromSheet();
        };

        function openModal(title, price, img, desc) {
            document.getElementById('modalTitleជន').innerText = title;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('modalImg').src = img;
            document.getElementById('modalDesc').innerHTML = desc;
            document.getElementById('modalWhatsapp').href = `https://wa.me/2001015421512?text=أرغب%20في%20طلب%20${encodeURIComponent(title)}`;
            document.getElementById('productModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('productModal').style.display = 'none'; }
        function closeModalBg(e) { if(e.target.id === 'productModal') closeModal(); }
    </script>
</body>
</html>
